kotlin = "latest"
lua-language-server = "latest"
minikube = "latest"
node = "22.23.3"
python = "3.12.12"
tmux = "latest"
uv = "latest"
"cargo:https://github.com/kiddos/basecode-lsp" = "latest"
"cargo:https://github.com/kiddos/cpfinder" = "latest"
"cargo:bat" = "latest"
"cargo:du-dust" = "latest"
"cargo:lsd" = "latest"
"cargo:ripgrep" = "latest"
"cargo:fd-find" = "latest"
"cargo:neocmakelsp" = "latest"
"cargo:protols" = "latest"
"cargo:zoxide" = "latest"
"cargo:yazi-build" = "latest"
"cargo:cargo-cache" = "latest"
"cargo:zellij" = "latest"
"cargo:tree-sitter-cli" = "latest"
"github:espressif/idf-im-ui" = "latest"
"npm:prettier" = "latest"
"npm:bash-language-server" = "latest"
